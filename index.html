<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕ Genshin Reflex Master | 反应力实验室与英雄榜</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa 0%, #fffde7 100%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      box-sizing: border-box;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(218, 165, 32, 0.15);
      max-width: 480px;
      width: 100%;
      text-align: center;
      border: 3px solid #b89f6b;
      position: relative;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    /* Jitter Border Effects */
    .effect-level-1 { border-color: #80cbc4 !important; box-shadow: 0 0 18px rgba(128, 203, 196, 0.6) !important; }
    .effect-level-2 { border-color: #4dd0e1 !important; box-shadow: 0 0 20px #4dd0e1 !important; }
    .effect-level-3 { border-color: #b388ff !important; box-shadow: 0 0 25px #b388ff !important; }
    .effect-level-4 { border-color: #ff9100 !important; box-shadow: 0 0 30px #ff9100 !important; }
    .effect-level-5 { border-color: #ff0055 !important; animation: overloadHue 1.2s linear infinite; }
    @keyframes overloadHue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    h1 { margin-top: 0; color: #3e4a5e; font-size: 1.4rem; }
    .badge { background: #b89f6b; color: #fffde7; padding: 0.2rem 0.8rem; border-radius: 12px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 0.5rem; }
    label { display: block; margin: 0.5rem 0 0.2rem; text-align: left; font-weight: bold; font-size: 0.85rem; color: #5c6b7f; }
    input, select, button { width: 100%; padding: 0.6rem; border-radius: 10px; border: 2px solid #e0e0e0; font-size: 0.9rem; outline: none; background-color: #fafafa; box-sizing: border-box; }
    
    .name-input-group { margin-bottom: 0.6rem; text-align: left; }
    .name-input-group input { border: 2px solid #b89f6b; background: #fff8e1; font-weight: bold; }

    .btn-group { display: flex; gap: 0.4rem; margin-top: 0.8rem; }
    button.primary { background: linear-gradient(45deg, #3e4a5e, #5c6b7f); color: white; border: none; font-weight: bold; cursor: pointer; }
    button.gacha-btn { background: linear-gradient(45deg, #ff9100, #ff5722); color: white; border: none; font-weight: bold; cursor: pointer; }
    button.inventory-btn { background: linear-gradient(45deg, #ab47bc, #7e57c2); color: white; border: none; font-weight: bold; cursor: pointer; }
    button.rank-btn { background: linear-gradient(45deg, #0288d1, #0097a7); color: white; border: none; font-weight: bold; cursor: pointer; }

    /* RUNNER GAME CANVAS */
    .game-container {
      margin: 0.8rem 0;
      background: #e0f2fe;
      border: 2px solid #b89f6b;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    canvas { display: block; width: 100%; height: 160px; }
    .game-controls { display: flex; justify-content: space-between; padding: 0.4rem 0.8rem; background: #fffde7; font-size: 0.85rem; font-weight: bold; color: #5c6b7f; }
    .jump-btn { background: #3e4a5e; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; width: auto; margin: 0.4rem 0; font-weight: bold; }

    /* EQUIPPED STATUS BOX */
    .equip-status {
      background: #fff8e1;
      border: 1px dashed #b89f6b;
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      text-align: left;
      color: #5c6b7f;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* MODALS */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .modal-card {
      background: white;
      padding: 1.5rem;
      border-radius: 20px;
      text-align: center;
      max-width: 380px;
      width: 85%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
    }
    .star-5 { border: 4px solid #ffb300; background: #fff8e1; }
    .star-4 { border: 4px solid #ab47bc; background: #f3e5f5; }
    .star-3 { border: 4px solid #29b6f6; background: #e1f5fe; }
    
    .inventory-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; }
    .inventory-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; border-radius: 8px; font-size: 0.85rem; background: #f5f5f5; border: 1px solid #ddd; }
    .inventory-item button { width: auto; padding: 0.3rem 0.6rem; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn-equip { background: #4caf50; color: white; }
    .btn-unequip { background: #e53935; color: white; }

    /* LEADERBOARD TABLE */
    .rank-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    .rank-table th, .rank-table td { padding: 0.5rem; border-bottom: 1px solid #eee; text-align: center; }
    .rank-table th { background: #f0f4f8; color: #3e4a5e; }

    .result { margin-top: 0.8rem; padding: 0.8rem; border-radius: 12px; font-weight: bold; background: white; border: 2px solid #b89f6b; text-align: left; display: none; }
  </style>
</head>

<body>

  <div class="card" id="mainCard">
    <span class="badge">✨ TEYVAT REFLEX LAB ✨</span>
    <h1>⚡ 提瓦特反应力测试与英雄榜</h1>

    <!-- 👤 PLAYER NAME INPUT -->
    <div class="name-input-group">
      <label for="playerName">✍️ 请输入探险家姓名 (Player Name):</label>
      <input type="text" id="playerName" value="旅行者" placeholder="输入你的名字...">
    </div>

    <!-- MAP SELECTION -->
    <label for="nation">🗺️ 选择地图背景 (Nation Map):</label>
    <select id="nation" onchange="changeNationMap()">
      <option value="mondstadt">🌱 蒙德 - 摘星崖</option>
      <option value="liyue">🪨 璃月 - 绝云间</option>
      <option value="inazuma">⚡ 稻妻 - 鸣神大社</option>
      <option value="fontaine">💧 枫丹 - 歌剧院</option>
      <option value="natlan">🔥 纳塔 - 圣火竞技场</option>
    </select>

    <!-- 🏃 RUNNER GAME CANVAS -->
    <div class="game-container">
      <div class="game-controls">
        <span>🏃 分数: <span id="gameScore">0</span></span>
        <span>💎 咖啡豆: <span id="gemScore">0</span></span>
      </div>
      <canvas id="runnerCanvas" width="400" height="160"></canvas>
      <button class="jump-btn" onclick="triggerJump()">🤾 跳跃 JUMP! (空格键 Space)</button>
    </div>

    <!-- 🛡️ EQUIPPED STATUS DISPLAY -->
    <div class="equip-status" id="equipStatusDisplay">
      <div><strong>🛡️ 装备：无</strong></div>
      <small>(无圣遗物加成)</small>
    </div>

    <!-- CHARACTER SELECTION -->
    <label for="persona">👤 选择出战角色 (Character):</label>
    <select id="persona" onchange="changeMentor()">
      <option value="xingqiu">🌊 行秋 Xingqiu</option>
      <option value="citlali">❄️ 茜特菈莉 Citlali</option>
      <option value="chongyun">❄️ 重云 Chongyun</option>
      <option value="wriothesley">❄️ 莱欧斯利 Wriothesley</option>
    </select>
    
    <label for="jitter">⚡ 神经兴奋度 (Jitter Level / 速度):</label>
    <select id="jitter" onchange="updateAura()">
      <option value="1">Level 1: 清醒 Calm (简单)</option>
      <option value="2">Level 2: 充沛 Charged (正常)</option>
      <option value="3">Level 3: 共鸣 Resonance (中等)</option>
      <option value="4">Level 4: 爆发 Burst (快速)</option>
      <option value="5">Level 5: 过载 Overload (极限!)</option>
    </select>

    <div class="btn-group">
      <button class="gacha-btn" onclick="pullGacha()">🌠 祈愿 (10豆)</button>
      <button class="inventory-btn" onclick="openInventory()">🎒 背包</button>
      <button class="rank-btn" onclick="openLeaderboard()">🏆 排行榜</button>
    </div>
    
    <button class="primary" style="margin-top:0.6rem;" onclick="consultOracle()">✨ 评估神经反应力 (CHECK) ✨</button>

    <div id="result" class="result"></div>
  </div>

  <!-- 🌠 GACHA MODAL POPUP -->
  <div id="gachaModal" class="modal">
    <div id="gachaCard" class="modal-card star-3">
      <div id="gachaStars" style="font-size:1.2rem; margin-bottom:0.5rem;">⭐⭐⭐</div>
      <div id="gachaItem" style="font-size:1.3rem; font-weight:bold; margin-bottom:0.5rem;">圣遗物名称</div>
      <div id="gachaDesc" style="font-size:0.85rem; color:#555; margin-bottom:1rem;">属性描述</div>
      <button class="jump-btn" onclick="closeGacha()">收下并存入背包</button>
    </div>
  </div>

  <!-- 🎒 INVENTORY MODAL -->
  <div id="inventoryModal" class="modal">
    <div class="modal-card" style="border: 3px solid #ab47bc;">
      <h2>🎒 我的圣遗物背包</h2>
      <div id="inventoryList" class="inventory-list"></div>
      <button class="jump-btn" style="margin-top:1rem;" onclick="closeInventory()">关闭背包</button>
    </div>
  </div>

  <!-- 🏆 LEADERBOARD MODAL -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-card" style="border: 3px solid #0288d1;">
      <h2>🏆 提瓦特反应力英雄榜</h2>
      <table class="rank-table">
        <thead>
          <tr>
            <th>名次</th>
            <th>探险家</th>
            <th>反应力得分</th>
          </tr>
        </thead>
        <tbody id="leaderboardRows">
          <!-- 排行榜数据列 -->
        </tbody>
      </table>
      <button class="jump-btn" style="margin-top:1rem;" onclick="closeLeaderboard()">关闭排行榜</button>
    </div>
  </div>

  <script>
    // ==========================================
    // 📸 1. 图片资源管理 (角色/地图/怪物)
    // ==========================================
    const characterImageData = {
      'xingqiu':     'images/xingqiu.jpg',
      'citlali':     'images/citlali.jpg',
      'chongyun':    'images/chongyun.jpg',
      'wriothesley': 'images/wriothesley.jpg'
    };

    // 👾 怪物图片留位 (地面丘丘人/史莱姆 & 空中风飘浮灵)
    const monsterImages = {
      hilichurl: new Image(),
      slime: new Image(),
      specter: new Image()
    };
    monsterImages.hilichurl.src = 'images/hilichurl.png'; // 地面：丘丘人
    monsterImages.slime.src     = 'images/slime.png';     // 地面：史莱姆
    monsterImages.specter.src   = 'images/specter.png';   // 空中：风飘浮灵

    const mapThemes = {
      'mondstadt': { sky: '#e0f2fe', ground: '#4caf50', obstacle: '#ff7043' },
      'liyue':     { sky: '#fff8e1', ground: '#fbc02d', obstacle: '#8d6e63' },
      'inazuma':   { sky: '#f3e5f5', ground: '#ab47bc', obstacle: '#7e57c2' },
      'fontaine':  { sky: '#e0f7fa', ground: '#0288d1', obstacle: '#26c6da' },
      'natlan':    { sky: '#fbe9e7', ground: '#d84315', obstacle: '#ff1744' }
    };

    // ==========================================
    // 🎒 2. 背包与圣遗物数据
    // ==========================================
    let inventory = [];
    let equippedArtifact = null; // 当前装备
    let hasShield = false;       // 护盾标记

    const gachaPool = {
      5: [
        { id: 'flower_5', star: 5, name: "🌟 生之花：生生不息花", type: "shield", desc: "【护盾】抵挡 1 次与怪物/障碍物的碰撞！" },
        { id: 'feather_5', star: 5, name: "🌟 死之羽：风行羽毛", type: "jump", desc: "【轻功】增强跳跃高度与滞空力！" }
      ],
      4: [
        { id: 'sand_4', star: 4, name: "💜 时之沙：双倍咖啡沙漏", type: "gem", desc: "【双倍】吃 1 个咖啡豆获得 20 咖啡豆！" }
      ],
      3: [
        { id: 'crown_3', star: 3, name: "💙 理之冠：学者帽子", type: "none", desc: "【装饰】无特殊属性加成。" }
      ]
    };

    function updateAura() {
      const jitter = parseInt(document.getElementById('jitter').value);
      const card = document.getElementById('mainCard');
      card.className = "card effect-level-" + jitter;
    }
    window.addEventListener('DOMContentLoaded', updateAura);

    // ==========================================
    // 🏃 3. 跑酷游戏逻辑 (含地面/空中怪物)
    // ==========================================
    const canvas = document.getElementById('runnerCanvas');
    const ctx = canvas.getContext('2d');
    
    let score = 0;
    let gems = 0;
    let gameFrame = 0;
    let isGameOver = false;

    const runnerImage = new Image();
    function updateRunnerSprite() {
      const persona = document.getElementById('persona').value;
      runnerImage.src = characterImageData[persona] || '';
    }
    updateRunnerSprite();
    function changeMentor() { updateRunnerSprite(); }

    let currentMap = mapThemes['mondstadt'];
    function changeNationMap() {
      const selectedNation = document.getElementById('nation').value;
      currentMap = mapThemes[selectedNation];
    }

    const runner = {
      x: 30, y: 95, width: 35, height: 35,
      vy: 0, gravity: 0.6, jumping: false
    };

    let obstacles = [];
    let coffeeBeans = [];

    function triggerJump() {
      if (!runner.jumping && !isGameOver) {
        // 装备羽毛后跳得更高
        const jumpForce = (equippedArtifact && equippedArtifact.type === 'jump') ? -12.5 : -10;
        runner.vy = jumpForce;
        runner.jumping = true;
      }
      if (isGameOver) resetGame();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        triggerJump();
      }
    });

    // 多样化怪物生成逻辑 (地面 + 空中)
    function spawnGameElements() {
      const jitterLevel = parseInt(document.getElementById('jitter').value) || 1;
      const spawnRate = Math.max(45, 110 - (jitterLevel * 10));

      if (gameFrame % spawnRate === 0) {
        const isAir = Math.random() > 0.55; // 45% 概率生成空中飘浮灵怪物
        
        obstacles.push({
          x: canvas.width,
          y: isAir ? 45 : 95, // 空中高度 45, 地面高度 95
          width: 30,
          height: 30,
          isAir: isAir,
          monsterType: isAir ? 'specter' : (Math.random() > 0.5 ? 'hilichurl' : 'slime')
        });
      }

      if (gameFrame % 90 === 0) {
        coffeeBeans.push({ x: canvas.width, y: 65, width: 16, height: 16 });
      }
    }

    function updateGame() {
      if (isGameOver) return;

      gameFrame++;
      score++;
      document.getElementById('gameScore').innerText = Math.floor(score / 5);

      runner.vy += runner.gravity;
      runner.y += runner.vy;
      if (runner.y > 95) {
        runner.y = 95;
        runner.vy = 0;
        runner.jumping = false;
      }

      spawnGameElements();

      const jitterLevel = parseInt(document.getElementById('jitter').value) || 1;
      const moveSpeed = 3.2 + (jitterLevel * 1.3); 

      // 怪物碰撞检测
      for (let i = 0; i < obstacles.length; i++) {
        obstacles[i].x -= moveSpeed;
        if (
          runner.x < obstacles[i].x + obstacles[i].width &&
          runner.x + runner.width > obstacles[i].x &&
          runner.y < obstacles[i].y + obstacles[i].height &&
          runner.y + runner.height > obstacles[i].y
        ) {
          // 🛡️ 护盾判断
          if (hasShield) {
            hasShield = false;
            obstacles.splice(i, 1);
            i--;
            alert("🛡️ 圣遗物护盾挡下了怪物的攻击！");
            continue;
          }
          handleGameOver();
        }
      }

      // 咖啡豆检测
      for (let i = 0; i < coffeeBeans.length; i++) {
        coffeeBeans[i].x -= moveSpeed;
        if (
          runner.x < coffeeBeans[i].x + coffeeBeans[i].width &&
          runner.x + runner.width > coffeeBeans[i].x &&
          runner.y < coffeeBeans[i].y + coffeeBeans[i].height &&
          runner.y + runner.height > coffeeBeans[i].y
        ) {
          const gainGems = (equippedArtifact && equippedArtifact.type === 'gem') ? 20 : 10;
          gems += gainGems;
          document.getElementById('gemScore').innerText = gems;
          coffeeBeans.splice(i, 1);
          i--;
        }
      }

      obstacles = obstacles.filter(obs => obs.x > -30);
      coffeeBeans = coffeeBeans.filter(bean => bean.x > -20);
    }

    function drawGame() {
      // 背景
      ctx.fillStyle = currentMap.sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 地面
      ctx.fillStyle = currentMap.ground;
      ctx.fillRect(0, 130, canvas.width, 30);

      // 角色
      if (runnerImage.complete && runnerImage.naturalWidth !== 0) {
        ctx.drawImage(runnerImage, runner.x, runner.y, runner.width, runner.height);
      } else {
        ctx.fillStyle = '#3e4a5e';
        ctx.fillRect(runner.x, runner.y, runner.width, runner.height);
      }

      // 护盾效果
      if (hasShield) {
        ctx.strokeStyle = '#ffb300';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(runner.x + 17, runner.y + 17, 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 👾 绘制怪物 (优先绘制图片，无图片绘制备用彩色方块)
      obstacles.forEach(obs => {
        const img = monsterImages[obs.monsterType];
        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(img, obs.x, obs.y, obs.width, obs.height);
        } else {
          // 备用颜色：空中紫粉色，地面橙褐色
          ctx.fillStyle = obs.isAir ? '#ab47bc' : currentMap.obstacle;
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        }
      });

      // 咖啡豆
      ctx.fillStyle = '#795548';
      coffeeBeans.forEach(bean => ctx.fillRect(bean.x, bean.y, bean.width, bean.height));

      if (isGameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = '15px Segoe UI';
        ctx.fillText('💥 被怪物击中！点击或按空格键重来', 80, 85);
      }
    }

    function gameLoop() {
      updateGame();
      drawGame();
      requestAnimationFrame(gameLoop);
    }

    function handleGameOver() {
      isGameOver = true;
      const finalScore = Math.floor(score / 5);
      const name = document.getElementById('playerName').value || '匿名探险家';
      saveScoreToLeaderboard(name, finalScore);
    }

    function resetGame() {
      obstacles = [];
      coffeeBeans = [];
      score = 0;
      isGameOver = false;
      gameFrame = 0;
      if (equippedArtifact && equippedArtifact.type === 'shield') hasShield = true;
    }

    gameLoop();

    // ==========================================
    // 🏆 4. 排行榜 (LEADERBOARD) 逻辑
    // ==========================================
    function saveScoreToLeaderboard(name, scoreVal) {
      let ranks = JSON.parse(localStorage.getItem('genshinReflexRanks') || '[]');
      ranks.push({ name: name, score: scoreVal });
      ranks.sort((a, b) => b.score - a.score); // 降序排列
      ranks = ranks.slice(0, 5); // 只保留前 5 名
      localStorage.setItem('genshinReflexRanks', JSON.stringify(ranks));
    }

    function openLeaderboard() {
      const tbody = document.getElementById('leaderboardRows');
      tbody.innerHTML = "";
      const ranks = JSON.parse(localStorage.getItem('genshinReflexRanks') || '[]');

      if (ranks.length === 0) {
        tbody.innerHTML = "<tr><td colspan='3'>尚无数据，快去挑战吧！</td></tr>";
      } else {
        ranks.forEach((r, index) => {
          const medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : index + 1));
          tbody.innerHTML += `
            <tr>
              <td><strong>${medal}</strong></td>
              <td>${r.name}</td>
              <td><strong>${r.score} 分</strong></td>
            </tr>
          `;
        });
      }
      document.getElementById('leaderboardModal').style.display = 'flex';
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    // ==========================================
    // 🎒 5. 背包与装备/卸下逻辑 (UNEQUIP)
    // ==========================================
    function pullGacha() {
      if (gems < 10) {
        alert("咖啡豆不足！在跑酷游戏里多吃点咖啡豆吧！（需要 10 咖啡豆）");
        return;
      }
      gems -= 10;
      document.getElementById('gemScore').innerText = gems;

      const rand = Math.random() * 100;
      let star = 3;
      if (rand < 15) star = 5;
      else if (rand < 45) star = 4;

      const items = gachaPool[star];
      const item = items[Math.floor(Math.random() * items.length)];

      inventory.push(item);

      const card = document.getElementById('gachaCard');
      card.className = `modal-card star-${star}`;
      document.getElementById('gachaStars').innerText = star === 5 ? "⭐⭐⭐⭐⭐" : (star === 4 ? "⭐⭐⭐⭐" : "⭐⭐⭐");
      document.getElementById('gachaItem').innerText = item.name;
      document.getElementById('gachaDesc').innerText = item.desc;

      document.getElementById('gachaModal').style.display = 'flex';
    }

    function closeGacha() { document.getElementById('gachaModal').style.display = 'none'; }

    function openInventory() {
      const listDiv = document.getElementById('inventoryList');
      listDiv.innerHTML = "";

      if (inventory.length === 0) {
        listDiv.innerHTML = "<div style='color:#888;'>背包空空如也，快去祈愿抽卡吧！</div>";
      } else {
        inventory.forEach((item, index) => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'inventory-item';
          
          const isEquipped = equippedArtifact && equippedArtifact.name === item.name;
          
          itemDiv.innerHTML = `
            <div style="text-align:left;">
              <strong>${item.name}</strong><br>
              <small style="color:#666;">${item.desc}</small>
            </div>
            ${isEquipped 
              ? `<button class="btn-unequip" onclick="unequipItem()">卸下</button>` 
              : `<button class="btn-equip" onclick="equipItem(${index})">装备</button>`
            }
          `;
          listDiv.appendChild(itemDiv);
        });
      }

      document.getElementById('inventoryModal').style.display = 'flex';
    }

    function closeInventory() { document.getElementById('inventoryModal').style.display = 'none'; }

    function equipItem(index) {
      equippedArtifact = inventory[index];
      hasShield = (equippedArtifact.type === 'shield');

      updateEquipUI();
      closeInventory();
      alert(`成功装备【${equippedArtifact.name}】！`);
    }

    // 🔓 卸下装备逻辑
    function unequipItem() {
      equippedArtifact = null;
      hasShield = false;

      updateEquipUI();
      openInventory(); // 刷新背包视图
      alert("已卸下装备！");
    }

    function updateEquipUI() {
      const display = document.getElementById('equipStatusDisplay');
      if (equippedArtifact) {
        display.innerHTML = `
          <div><strong>🛡️ 已装备：${equippedArtifact.name}</strong></div>
          <small>(${equippedArtifact.desc})</small>
        `;
      } else {
        display.innerHTML = `
          <div><strong>🛡️ 装备：无</strong></div>
          <small>(无圣遗物加成)</small>
        `;
      }
    }

    // 科学评估 Verdict
    function consultOracle() {
      const jitter = parseInt(document.getElementById('jitter').value);
      const name = document.getElementById('playerName').value || '旅行者';
      const currentScore = Math.floor(score / 5);
      const resultDiv = document.getElementById('result');

      let isAllowed = currentScore >= 15 && jitter <= 3;
      let reason = isAllowed 
        ? `🎉 <strong>反应力合格！</strong> 探险家【${name}】冲刺获得 <strong>${currentScore} 分</strong>，成功通过测试！`
        : `🐢 <strong>神经过载或反应较慢！</strong> 冲刺分数为 <strong>${currentScore} 分</strong>，建议降低兴奋度再试！`;

      let html = `<div><strong>科学判定 Verdict:</strong> ${isAllowed ? "✅ PASSED (合格)" : "❌ FAILED (未合格)"}</div>`;
      html += `<div style="margin-top:0.4rem; font-size:0.9rem;">${reason}</div>`;

      resultDiv.innerHTML = html;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
