<body>

  <div class="card" id="mainCard">
    <span class="badge">✨ TEYVAT BRANCH ✨</span>
    <h1>☕ Caffeine Oracle</h1>
    
    <!-- Audio Player Controls -->
    <div class="audio-player-box">
      <button id="bgmToggleBtn" onclick="toggleBGM()">🎵 BGM: Off</button>
      <div style="display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: #5c6b7f;">
        🔊 <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.1" value="0.3" onchange="adjustVolume(this.value)">
      </div>
    </div>

    <!-- Daily Counter -->
    <div class="counter-box">
      <span>Today's Energy Intake: <strong id="cupCount">0</strong> ☕</span>
      <div>
        <button class="counter-btn" onclick="adjustCups(1)">+1</button>
        <button class="counter-btn" onclick="adjustCups(-1)">-1</button>
      </div>
    </div>

    <!-- Mentor Selection -->
    <label for="persona" onchange="changePersonaMusic()">Select your Genshin Mentor:</label>
    <select id="persona" onchange="changePersonaMusic()">
      <option value="tsundere">Tsundere (Citlali)</option>
      <option value="shonen">Shonen Hero (Chongyun)</option>
      <option value="demon">Dark Lord (Wriothesley)</option>
    </select>
    
    <label for="bedtime">Planned "Log Off" Bedtime:</label>
    <input type="time" id="bedtime" value="23:00">

    <label for="jitter">Elemental Overload / Jitter Level:</label>
    <select id="jitter" onchange="updateAura()">
      <option value="1">Level 1: Mortal Calm 🧘</option>
      <option value="2">Level 2: Charged Up 🚶</option>
      <option value="3">Level 3: Elemental Resonance ⚡</option>
      <option value="4">Level 4: Elemental Burst 💥</option>
      <option value="5">Level 5: C6 Constellation Overload 🌀</option>
    </select>

    <button class="primary" onclick="consultOracle()">✨ SUMMON VERDICT ✨</button>

    <!-- Character Image Container -->
    <div id="characterPortraitContainer" class="character-portrait-container">
      <img id="characterPortrait" src="" alt="Genshin Character Portrait" class="character-portrait">
    </div>

    <div id="result" class="result" style="display: none;"></div>
  </div>

  <audio id="bgmAudio" loop></audio>

  <script>
    const characterImageData = {
      'tsundere': 'Citlali sticker 4_5.jpg',
      'shonen':   'Chongyun !.jpg',
      'demon':    '★ Wriothesley.jpg'
    };

    const characterAudioData = {
      'tsundere': 'Beneath the Mask -instrumental version-.mp3',
      'shonen':   'Color Your Night (Instrumental).mp3',
      'demon':    'Heaven (Instrumental).mp3'
    };

    const genshinDrinks = [
      "🌿 Adeptus Special Mint Brew",
      "🥂 Dawn Winery Grape Juice (Decaf)",
      "🥛 Mondstadt Warm Milk",
      "🧪 Sucrose's Special Alchemy Elixir (Decaf)"
    ];

    const bgm = document.getElementById('bgmAudio');
    let isMusicPlaying = false;
    bgm.volume = 0.3;

    function toggleBGM() {
      const btn = document.getElementById('bgmToggleBtn');
      if (isMusicPlaying) {
        bgm.pause();
        isMusicPlaying = false;
        btn.innerText = "🎵 BGM: Off";
      } else {
        playMusicForCurrentPersona();
      }
    }

    function adjustVolume(val) {
      bgm.volume = val;
    }

    function changePersonaMusic() {
      if (isMusicPlaying) {
        playMusicForCurrentPersona();
      }
    }

    function playMusicForCurrentPersona() {
      const persona = document.getElementById('persona').value;
      const audioFile = characterAudioData[persona];
      const btn = document.getElementById('bgmToggleBtn');

      if (audioFile && !audioFile.startsWith('REPLACE_WITH')) {
        if (!bgm.src.endsWith(audioFile)) {
          bgm.src = audioFile;
        }
        bgm.play().then(() => {
          isMusicPlaying = true;
          btn.innerText = "🎵 BGM: Playing";
        }).catch(err => {
          console.log("Browser prevented autoplay. User must interact first.");
        });
      }
    }

    let cups = parseInt(localStorage.getItem('genshinCoffeeCount')) || 0;
    document.getElementById('cupCount').innerText = cups;

    function adjustCups(amount) {
      cups = Math.max(0, cups + amount);
      localStorage.setItem('genshinCoffeeCount', cups);
      document.getElementById('cupCount').innerText = cups;
    }

    // ========================================================
    // Dynamic Aura Update Logic for All 5 Levels
    // ========================================================
    function updateAura() {
      const jitter = parseInt(document.getElementById('jitter').value);
      const card = document.getElementById('mainCard');
      
      // Clear previous level classes
      card.classList.remove('effect-level-1', 'effect-level-2', 'effect-level-3', 'effect-level-4', 'effect-level-5');
      
      // Apply class corresponding to current level
      if (jitter >= 1 && jitter <= 5) {
        card.classList.add(`effect-level-${jitter}`);
      }
    }

    // Initialize Aura on startup
    window.addEventListener('DOMContentLoaded', updateAura);

    function consultOracle() {
      if (!isMusicPlaying) {
        playMusicForCurrentPersona();
      }

      const bedtimeInput = document.getElementById('bedtime').value;
      const jitter = parseInt(document.getElementById('jitter').value);
      const persona = document.getElementById('persona').value;
      const resultDiv = document.getElementById('result');
      const portraitContainer = document.getElementById('characterPortraitContainer');
      const portraitImg = document.getElementById('characterPortrait');

      if (!bedtimeInput) {
        resultDiv.innerText = "Please set a log-off time first!";
        resultDiv.style.display = 'block';
        portraitContainer.classList.remove('show');
        return;
      }

      const now = new Date();
      const [bedHour, bedMin] = bedtimeInput.split(':').map(Number);
      let bedtime = new Date();
      bedtime.setHours(bedHour, bedMin, 0, 0);

      if (bedtime < now) bedtime.setDate(bedtime.getDate() + 1);
      const hoursUntilBed = (bedtime - now) / (1000 * 60 * 60);

      const imageFile = characterImageData[persona];
      if (imageFile && !imageFile.startsWith('REPLACE_WITH')) {
        portraitImg.src = imageFile;
        portraitContainer.classList.add('show');
      } else {
        portraitContainer.classList.remove('show');
      }

      let isAllowed = true;
      let reason = "";

      if (jitter >= 4) {
        isAllowed = false;
        reason = "Your elemental overload (jitter) is maxed out! Drinking more will cause an elemental reaction meltdown!";
      } else if (hoursUntilBed < 6) {
        isAllowed = false;
        reason = `Bedtime is in ${hoursUntilBed.toFixed(1)} hours! Drink now and you'll wander Mondstadt as a restless phantom all night!`;
      } else if (cups >= 4) {
        isAllowed = false;
        reason = "You've already consumed 4+ cups today! Your elemental reserves need to recharge!";
      } else {
        isAllowed = true;
        reason = "You have room in your energy bar. The Adventurers' Guild contract is fulfilled!";
      }

      let personaMessage = "";
      if (persona === "tsundere") {
        personaMessage = isAllowed 
          ? "“Hmph, fine! Drink it if you want! It's not like I brewed extra just because I was worried you were tired or anything... dummy (B-Baka)!”" 
          : "“Stop right there, idiot! Drink any more and you won't sleep at all! I... I definitely don't want to stay up all night keeping you company!”";
      } else if (persona === "shonen") {
        personaMessage = isAllowed 
          ? "“All right! Ignite your caffeine spirit! Push past your limits and let's keep exploring today! PLUS ULTRA! 🔥”" 
          : "“Halt! A true adventurer knows when to rest and recover! Sleep well tonight so we can team up tomorrow!”";
      } else if (persona === "demon") {
        personaMessage = isAllowed 
          ? "“Heh, I grant you permission to partake in this dark elixir... Unleash the sealed power within you! Bwahahaha!”" 
          : "“Warning! Your mortal body cannot withstand the abyss of the black nectar (Coffee)! Step back from this forbidden power!”";
      }

      let html = `<div><strong>Verdict:</strong> ${isAllowed ? "✅ APPROVED (Brew Away)" : "❌ DENIED (Step Away)"}</div>`;
      html += `<div style="margin-top:0.3rem;">${reason}</div>`;
      html += `<div class="persona-quote">${personaMessage}</div>`;

      if (!isAllowed) {
        const randomAlt = genshinDrinks[Math.floor(Math.random() * genshinDrinks.length)];
        html += `<div style="margin-top:0.6rem; font-size:0.85rem; color:#888;">🍵 Recommended Alternative Elixir: <strong>${randomAlt}</strong></div>`;
      }

      resultDiv.innerHTML = html;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
